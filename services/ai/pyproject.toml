[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dentalai-ai"
version = "0.0.0"
description = "DentalAI inference-service boundary without an inference implementation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

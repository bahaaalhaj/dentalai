# Include inside an operator-managed HTTPS server block with TLS 1.2/1.3 and real certificates.
# No HTTP listener serving clinical traffic; redirect port 80 to HTTPS in the surrounding config.
client_max_body_size 10m;
client_body_timeout 15s;
client_header_timeout 10s;
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Replace, don't append, browser-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 40s;
    proxy_send_timeout 30s;
}
# Never proxy monitoring or inference services. Disable access logs containing URLs/queries.
access_log off;

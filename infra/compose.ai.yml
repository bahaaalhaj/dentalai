# Optional PRIVATE inference overlay. No artifact means /ready=503, never invented detections.
services:
  ai:
    profiles: [ai]
    build:
      context: ../services/ai
    restart: unless-stopped
    environment:
      AI_ENV: production
      AI_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
      AI_MODEL_MANIFEST: /models/manifest.json
    secrets: [ai_service_token]
    volumes:
      - type: bind
        source: ${AI_MODEL_DIRECTORY:?Set an existing, reviewed private model directory}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    networks: [private]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
secrets:
  ai_service_token:
    file: ${SECRETS_DIRECTORY:?Set an absolute private secrets directory}/ai_service_token

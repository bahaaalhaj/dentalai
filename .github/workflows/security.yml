name: Security and deployment
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: /tmp/codeql-results
      - name: Fail on high/critical SAST findings; no blanket suppression
        run: node scripts/check-sarif.mjs /tmp/codeql-results
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch only retained clinic-photo originals for reproducible optimization
        run: git lfs pull --include="apps/web/assets/clinic-originals/*.jpg" --exclude=""
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build immutable deployment candidates
        run: |
          docker build -f infra/Dockerfile -t dentalai-app:$RELEASE_TAG .
          docker build -t dentalai-ai:$RELEASE_TAG services/ai
          docker build -f infra/postgres/Dockerfile -t dentalai-postgres:$RELEASE_TAG .
      - name: Prove runtime imports and absence of unnecessary build toolchain
        run: |
          node scripts/check-runtime-image.mjs
          node scripts/check-service-images.mjs
      - name: Scan ALL high and critical container vulnerabilities (including unfixed)
        run: node scripts/scan-containers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-vulnerability-evidence
          path: .local/security/
          if-no-files-found: warn
      - name: Validate pilot Compose without credentials on stdout
        env:
          DEPLOYMENT_ENV: staging
          APP_ORIGIN: https://staging.example.invalid
          MAIL_FROM: noreply@example.invalid
          SECRETS_DIRECTORY: /tmp/never-production-secrets
        run: docker compose -f infra/compose.pilot.yml config --quiet
      - name: Install/build the actual restore-drill harness
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm ci
          npm run build:packages
          npm run build --workspace @dentalai/api
      - name: Restore encrypted synthetic backup into a clean isolated project
        run: npm run test:restore-drill

name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_database_only@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Rebuild PostgreSQL from zero and test constraints
        run: npm run test:db

      - name: Build production bundle
        run: npm run build

      - name: Install browser for appointment E2E
        run: npx playwright install --with-deps --no-shell chromium

      - name: Patient booking and staff confirmation E2E
        run: npm run test:e2e

      - name: Validate local infrastructure configuration
        env:
          POSTGRES_DB: ci_validation
          POSTGRES_USER: ci_validation
          POSTGRES_PASSWORD: ci_validation_only
          MINIO_ROOT_USER: ci_validation
          MINIO_ROOT_PASSWORD: ci_validation_only
          MINIO_BUCKET: ci-validation
        run: docker compose -f infra/compose.yml config --quiet

      - name: Audit dependencies
        run: npm run audit

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2

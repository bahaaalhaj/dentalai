name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_database_only@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prevent new training data, runs, caches and model artifacts
        env:
          ARTIFACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-artifacts.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Set up private inference test runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install inference runtime and run nonclinical fixture tests
        run: |
          python -m pip install uv==0.12.23
          uv sync --project services/ai --frozen --extra test
          uv run --project services/ai --frozen --extra test python -m pytest services/ai/tests -q

      - name: Rebuild PostgreSQL from zero and test constraints
        run: npm run test:db

      - name: Build production bundle
        run: npm run build

      - name: Install browser for appointment, clinical and billing E2E
        run: npx playwright install --with-deps --no-shell chromium

      - name: Appointment, approved clinical-history and billing-ledger E2E
        run: npm run test:e2e

      - name: Validate local infrastructure configuration
        env:
          POSTGRES_DB: ci_validation
          POSTGRES_USER: ci_validation
          POSTGRES_PASSWORD: ci_validation_only
          MINIO_ROOT_USER: ci_validation
          MINIO_ROOT_PASSWORD: ci_validation_only
          MINIO_BUCKET: ci-validation
        run: docker compose -f infra/compose.yml config --quiet

      - name: Audit dependencies
        run: npm run audit

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        run: >-
          docker run --rm --network none
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --log-opts="--all"

name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:ci_database_only@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch only retained clinic-photo originals for reproducible optimization
        run: git lfs pull --include="apps/web/assets/clinic-originals/*.jpg" --exclude=""

      - name: Resolve a reviewed artifact baseline, including new-branch pushes
        env:
          ARTIFACT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARTIFACT_PUSH_BEFORE_SHA: ${{ github.event.before }}
          ARTIFACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/resolve-artifact-baseline.mjs >> "$GITHUB_ENV"

      - name: Prevent new training data, runs, caches and model artifacts
        run: node scripts/check-artifacts.mjs

      - name: Build and start the same hardened PostgreSQL candidate used by deployment
        run: |
          docker build -f infra/postgres/Dockerfile -t dentalai-postgres:ci-${{ github.sha }} .
          docker run -d --name dentalai-ci-postgres -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci_database_only -p 127.0.0.1:5432:5432 --health-cmd="pg_isready -U postgres -d postgres" --health-interval=2s --health-timeout=3s --health-retries=30 dentalai-postgres:ci-${{ github.sha }}
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dentalai-ci-postgres)" = healthy ]; then exit 0; fi
            sleep 2
          done
          echo "Disposable PostgreSQL did not become healthy" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check UI literal extraction
        run: npm run i18n:check
      - name: Bilingual interface and source-size regression gates
        run: |
          npm run i18n:arabic
          npm run source:check

      - name: Check requirement IDs, test traceability and local documentation links
        run: node scripts/check-documentation.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test
      - name: Backup cryptography failure-path tests
        run: npm run test:backup
      - name: Toolchain and release-input failure-path tests
        run: npm run test:gates

      - name: Set up private inference test runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install inference runtime and run nonclinical fixture tests
        run: |
          python -m pip install uv==0.12.23
          uv sync --project services/ai --frozen --extra test
          uv run --project services/ai --frozen --extra test python -m pytest services/ai/tests -q

      - name: Rebuild PostgreSQL from zero and test constraints
        run: npm run test:db
      - name: Business-logic coverage including integration authorization
        id: coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Build production bundle
        run: npm run build
      - name: Production asset budgets
        run: npm run bundle:check

      - name: Install browser for administration, appointment, clinical, billing and imaging E2E
        run: npx playwright install --with-deps --no-shell chromium

      - name: Bilingual administration, onboarding, appointments, clinical, billing and private imaging
        run: npm run test:e2e

      - name: Validate local infrastructure configuration
        env:
          POSTGRES_DB: ci_validation
          POSTGRES_USER: ci_validation
          POSTGRES_PASSWORD: ci_validation_only
          MINIO_ROOT_USER: ci_validation
          MINIO_ROOT_PASSWORD: ci_validation_only
          MINIO_BUCKET: ci-validation
        run: |
          docker compose -f infra/compose.yml config --quiet
          docker compose -f infra/compose.local.yml config --quiet

      - name: Audit dependencies
        run: npm run audit

      - name: Stop only the disposable CI PostgreSQL container
        if: always()
        run: docker rm -f dentalai-ci-postgres 2>/dev/null || true

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        run: >-
          docker run --rm --network none
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --log-opts="--all"
